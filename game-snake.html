<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#12301f;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}
#dp{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}
#dp div{display:flex;gap:8px}
#dp button{width:68px;height:54px;border:0;border-radius:14px;background:#a6f07a;color:#12301f;font-size:24px;font-weight:900;box-shadow:0 4px 0 #0b1f13;touch-action:manipulation}
#dp button:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1f13}</style></head>
<body><canvas id="c"></canvas>
<div id="dp"><button data-d="u" aria-label="Вверх">▲</button><div><button data-d="l" aria-label="Влево">◀</button><button data-d="d" aria-label="Вниз">▼</button><button data-d="r" aria-label="Вправо">▶</button></div></div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,D=Math.min(window.devicePixelRatio||1,2),N=18,cs,ox,oy;
function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
  var ah=H-56-136;cs=Math.floor(Math.min(W-16,ah)/N);ox=Math.floor((W-cs*N)/2);oy=56+Math.floor((ah-cs*N)/2)}
addEventListener('resize',rs);rs();
var st='ready',sn,dir,q,food,score=0,best=0,delay,acc=0,last=0,endAt=0;
function reset(){sn=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir={x:1,y:0};q=[];score=0;delay=140;acc=0;place();st='play'}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(function(s){return s.x===food.x&&s.y===food.y}))}
function turn(d){var p=q.length?q[q.length-1]:dir;if(d.x===-p.x&&d.y===-p.y||d.x===p.x&&d.y===p.y)return;if(q.length<2)q.push(d)}
function end(){st='over';endAt=performance.now();if(score>best)best=score;try{parent.postMessage({fg:'score',value:score},'*')}catch(e){}}
function step(){
  if(q.length)dir=q.shift();
  var h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(function(s){return s.x===h.x&&s.y===h.y})){end();return}
  sn.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;delay=Math.max(70,delay-3);place()}else sn.pop();
}
var sx,sy;
c.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;
  if(st!=='play'&&performance.now()-endAt>400)reset()});
c.addEventListener('pointermove',function(e){if(sx==null||st!=='play')return;
  var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<22&&Math.abs(dy)<22)return;
  turn(Math.abs(dx)>Math.abs(dy)?{x:dx>0?1:-1,y:0}:{x:0,y:dy>0?1:-1});sx=e.clientX;sy=e.clientY});
c.addEventListener('pointerup',function(){sx=null});
var DIRS={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
Array.prototype.forEach.call(document.querySelectorAll('#dp button'),function(b){
  b.addEventListener('pointerdown',function(e){e.preventDefault();
    if(st!=='play'){if(performance.now()-endAt>400){reset();turn(DIRS[b.dataset.d])}}else turn(DIRS[b.dataset.d])})});
addEventListener('keydown',function(e){var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){if(st!=='play'&&performance.now()-endAt>400)reset();else turn({x:m[0],y:m[1]})}else if(e.key===' '&&st!=='play')reset()});
function draw(){
  x.fillStyle='#12301f';x.fillRect(0,0,W,H);
  for(var i=0;i<N;i++)for(var j=0;j<N;j++){x.fillStyle=(i+j)%2?'#1b4a2f':'#1f5435';x.fillRect(ox+i*cs,oy+j*cs,cs,cs)}
  x.font=Math.floor(cs*.85)+'px serif';x.textAlign='center';x.textBaseline='middle';
  if(food)x.fillText('🍎',ox+food.x*cs+cs/2,oy+food.y*cs+cs/2+1);
  if(sn)sn.forEach(function(s,i){x.fillStyle=i?'#7bd957':'#a6f07a';var p=2;
    x.beginPath();x.roundRect?x.roundRect(ox+s.x*cs+p,oy+s.y*cs+p,cs-p*2,cs-p*2,cs*.3):x.rect(ox+s.x*cs+p,oy+s.y*cs+p,cs-p*2,cs-p*2);x.fill();
    if(!i){x.fillStyle='#12301f';var ex=dir.y?cs*.25:0,ey=dir.x?cs*.25:0;
      x.beginPath();x.arc(ox+s.x*cs+cs/2+dir.x*cs*.15-ex,oy+s.y*cs+cs/2+dir.y*cs*.15-ey,cs*.09,0,7);x.arc(ox+s.x*cs+cs/2+dir.x*cs*.15+ex,oy+s.y*cs+cs/2+dir.y*cs*.15+ey,cs*.09,0,7);x.fill()}});
  x.fillStyle='#e8ffd9';x.font='bold 22px system-ui,sans-serif';x.textAlign='left';x.fillText('🍎 '+score,16,28);
  x.textAlign='right';x.fillText('Рекорд '+best,W-16,28);x.textAlign='center';
  if(st!=='play'){x.fillStyle='rgba(8,24,15,.65)';x.fillRect(0,0,W,H);x.fillStyle='#fff';
    x.font='bold 32px system-ui,sans-serif';x.fillText(st==='ready'?'🐍 Змейка':'Игра окончена',W/2,H*.4);
    x.font='20px system-ui,sans-serif';
    if(st==='over')x.fillText('Счёт: '+score,W/2,H*.4+40);
    x.fillText(st==='ready'?'Нажми стрелку или коснись, чтобы начать':'Коснись, чтобы сыграть ещё',W/2,H*.4+(st==='over'?74:40))}
}
function loop(ts){var dt=Math.min(ts-last,100);last=ts;
  if(st==='play'){acc+=dt;while(acc>=delay&&st==='play'){acc-=delay;step()}}
  draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
